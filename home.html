<!doctype html>
<html data-theme="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>payoo bank</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <!-- tailwind + daisyui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- css -->
    <style>
      * {
        font-family: 'Outfit', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-200">
    <section id="hero">
      <header
        class="border-b-2 border-gray-200 flex justify-between items-center py-3 w-11/12 mx-auto"
      >
        <div class="left flex justify-between items-center gap-2">
          <div class="logo w-[60px]">
            <img src="./assets/logo.png" alt="" />
          </div>
          <div class="balance-info">
            <h2 class="text-neutral font-bold text-2xl">
              $<span id="balance">45000</span>
            </h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div class="right">
          <a href="./index.html" class="btn text-neutral/50">
            <span><i class="fa-solid fa-arrow-right-from-bracket"></i></span>Log
            Out
          </a>
        </div>
      </header>
    </section>

    <section id="welcome" class="w-11/12 mx-auto mt-8 space-y-5">
      <h2 class="text-3xl font-bold">
        Welcome to Pay<span class="text-primary">oo</span>
      </h2>
      <p>
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>
      <div class="card-box grid grid-cols-3 gap-5">
        <button
          onclick="showOnly('add-money')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-1.png" alt="" />
          <p>Add Money</p>
        </button>
        <button
          onclick="showOnly('cashout')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-2.png" alt="" />
          <p>Cashout</p>
        </button>
        <button
          onclick="showOnly('send-money')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-3.png" alt="" />
          <p>Send Money</p>
        </button>
        <button
          onclick="showOnly('bonus')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-4.png" alt="" />
          <p>Get Bonus</p>
        </button>
        <button
          onclick="showOnly('pay-bill')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-5.png" alt="" />
          <p>Pay Bill</p>
        </button>
        <button
          onclick="showOnly('history')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-6.png" alt="" />
          <p>Transactions</p>
        </button>
      </div>
    </section>

    <section id="add-money" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-5">Add Money</h2>
      <div class="card bg-base-100 w-full mx-auto">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Select A Bank</label>
            <select
              id="select-bank"
              class="select rounded-full bg-base-200 w-full"
            >
              <option disabled selected>Select back</option>
              <option value="DBBL">DBBL</option>
              <option value="City Bank">City Bank</option>
              <option value="IBBL">IBBL</option>
            </select>
            <label class="label text-neutral font-bold"
              >Bank Account Number</label
            >
            <input
              type="text"
              id="bank-account"
              minlength="11"
              maxlength="11"
              value=""
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 11 digit account number"
            />
            <label class="label text-neutral font-bold">Amount to Add</label>
            <input
              type="number"
              id="add-amount"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Add Amount to withdraw"
            />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              type="password"
              id="add-pin"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 4 digit pin number"
            />
            <button
              id="add-btn"
              class="btn btn-neutral mt-4 bg-primary rounded-full"
            >
              Add Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-5">Cash Out</h2>
      <div class="card bg-base-100 w-full mx-auto">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Agent Number</label>
            <input
              type="text"
              id="agent-number"
              minlength="11"
              maxlength="11"
              value="01234567891"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 11 digit number"
            />
            <label class="label text-neutral font-bold">Amount</label>
            <input
              type="number"
              id="cashout-amount"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter amount to withdraw"
            />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              type="password"
              id="cashout-pin"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 4 digit pin number"
            />
            <button
              id="cashout-btn"
              class="btn btn-neutral mt-4 bg-primary rounded-full"
            >
              Withdraw Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <section id="send-money" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-5">Send Money</h2>
      <div class="card bg-base-100 w-full mx-auto">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold"
              >User Account Number</label
            >
            <input
              type="text"
              id="user-account"
              minlength="11"
              maxlength="11"
              value=""
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 11 digit number"
            />
            <label class="label text-neutral font-bold">Amount</label>
            <input
              type="number"
              id="send-amount"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter amount to transfer"
            />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              type="password"
              id="send-pin"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 4 digit pin number"
            />
            <button
              id="send-btn"
              class="btn btn-neutral mt-4 bg-primary rounded-full"
            >
              Send Now
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <section id="bonus" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-5">Get Bonus</h2>
      <div class="card bg-base-100 w-full mx-auto">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold"
              >Enter Bonus Coupon</label
            >
            <input
              type="text"
              id="bonus-number"
              minlength="11"
              maxlength="11"
              value=""
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter your coupon"
            />

            <button
              id="bonus-btn"
              class="btn btn-neutral mt-4 bg-primary rounded-full"
            >
              Get Bonus
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <section id="pay-bill" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-5">Pay Bill</h2>
      <div class="card bg-base-100 w-full mx-auto">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Select To Pay</label>
            <select
              id="select-pay"
              class="select rounded-full bg-base-200 w-full"
            >
              <option disabled selected>Select back</option>
              <option value="Electricity Bill">Electricity Bill</option>
              <option value="Water Bill">Water Bill</option>
              <option value="Gas Bill">Gas Bill</option>
              <option value="Internet Bill">Internet Bill</option>
              <option value="Telephone Bill">Telephone Bill</option>
            </select>
            <label class="label text-neutral font-bold"
              >Biller Account Number</label
            >
            <input
              type="text"
              id="pay-account"
              minlength="11"
              maxlength="11"
              value=""
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter account number"
            />
            <label class="label text-neutral font-bold">Amount to Pay</label>
            <input
              type="number"
              id="pay-amount"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Add Amount to pay"
            />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              type="password"
              id="pay-pin"
              minlength="4"
              maxlength="4"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 4 digit pin number"
            />
            <button
              id="pay-btn"
              class="btn btn-neutral mt-4 bg-primary rounded-full"
            >
              Pay Now
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <section id="history" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-5">Transactions</h2>
      <div id="history-container" class=""></div>
    </section>

    <script src="./script/helpers.js"></script>
    <script src="./script/addMoney.js"></script>
    <script src="./script/cashout.js"></script>
    <script src="./script/sendMoney.js"></script>
    <script src="./script/payBill.js"></script>
  </body>
</html>
