<!doctype html>
<html data-theme="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>payoo bank</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <!-- tailwind + daisyui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- css -->
    <style>
      * {
        font-family: 'Outfit', sans-serif;
      }
    </style>
  </head>
  <body>
    <section id="login">
      <div class="min-h-screen max-w-md mx-auto bg-base-200">
        <div class="logo w-[200px] pt-[210px] mx-auto">
          <img src="./assets/Logo-full.png" alt="" />
        </div>
        <div class="form mt-8">
          <div
            class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto"
          >
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label text-neutral font-bold"
                  >Mobile Number</label
                >
                <input
                  type="text"
                  id="mobile-number"
                  minlength="11"
                  maxlength="11"
                  class="input rounded-full bg-base-200"
                  placeholder="Enter your number"
                />
                <label class="label text-neutral font-bold">4 Digit Pin</label>
                <input
                  type="password"
                  id="pin"
                  minlength="4"
                  maxlength="4"
                  class="input rounded-full bg-base-200"
                  placeholder="Enter 4 Digit Pin"
                />
                <button
                  id="login-btn"
                  class="btn btn-neutral mt-4 bg-primary rounded-full"
                >
                  Login
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="./script/login.js"></script>
    <script src="./script/helpers.js"></script>
  </body>
</html>
